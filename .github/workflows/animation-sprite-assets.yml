name: animation-sprite-assets

on:
  push:
    branches:
      - agent/animation-sprite-pass-20260928
    paths:
      - prototype/current/tools/build_sprite_assets.py
      - .github/workflows/animation-sprite-assets.yml

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate sprite sheets
        working-directory: prototype/current
        run: python tools/build_sprite_assets.py
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototype/current/public/assets/animation prototype/current/public/assets/items
          if git diff --cached --quiet; then
            echo "No asset changes"
          else
            git commit -m "animation: generate v2 sprite assets [skip sprite-build]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
